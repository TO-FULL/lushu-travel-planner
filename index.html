<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路书 · 智能旅行行程规划</title>
  <meta name="description" content="输入目的地、日期、人数、预算与偏好，一键生成每日行程。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
      <span class="brand-name">路书</span>
      <span class="brand-sub">智能旅行规划</span>
    </div>
    <button class="btn btn-secondary" id="navSaved" type="button">
      我的行程
      <span class="nav-badge" id="savedBadge" hidden>0</span>
    </button>
  </header>

  <main id="top">
    <section class="planner-section" id="planner" aria-label="行程规划">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">开始规划</p>
          <h2>告诉我你的出行需求</h2>
        </div>
        <form class="planner-card" id="plannerForm" novalidate>
          <div class="planner-grid">
            <label class="field field-destination">
              <span class="field-label">目的地</span>
              <span class="input-wrap">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="destination" name="destination" list="cityOptions" autocomplete="off" placeholder="搜索或输入城市，如 上海 / 魔都">
                <datalist id="cityOptions"></datalist>
              </span>
            </label>

            <label class="field">
              <span class="field-label">出发日期</span>
              <input id="startDate" name="startDate" type="date">
            </label>

            <label class="field">
              <span class="field-label">返回日期</span>
              <input id="endDate" name="endDate" type="date">
            </label>

            <label class="field">
              <span class="field-label">出行人数</span>
              <span class="stepper">
                <button type="button" id="peopleMinus" aria-label="减少人数">−</button>
                <input id="people" name="people" type="number" min="1" max="20" value="2">
                <button type="button" id="peoplePlus" aria-label="增加人数">+</button>
              </span>
            </label>

            <label class="field">
              <span class="field-label">预算下限（元）</span>
              <input id="budgetMin" name="budgetMin" type="number" min="500" step="500" value="3000">
            </label>

            <label class="field">
              <span class="field-label">预算上限（元）</span>
              <input id="budgetMax" name="budgetMax" type="number" min="500" step="500" value="6000">
            </label>
          </div>

          <div class="planner-row">
            <span class="field-label">行程天数</span>
            <span class="stepper">
              <button type="button" id="daysMinus" aria-label="减少天数">−</button>
              <input id="days" name="days" type="number" min="1" max="14" value="3">
              <button type="button" id="daysPlus" aria-label="增加天数">+</button>
            </span>
            <span class="days-hint" id="daysHint">共 3 天</span>
          </div>

          <div class="planner-row">
            <span class="field-label">核心偏好（最多选 2 项）</span>
            <div class="pref-chips" id="prefChips">
              <label class="chip"><input type="checkbox" name="pref" value="美食"><span class="chip-body">美食</span></label>
              <label class="chip"><input type="checkbox" name="pref" value="历史"><span class="chip-body">历史</span></label>
              <label class="chip"><input type="checkbox" name="pref" value="自然"><span class="chip-body">自然</span></label>
              <label class="chip"><input type="checkbox" name="pref" value="休闲"><span class="chip-body">休闲</span></label>
            </div>
          </div>

          <div class="planner-row">
            <span class="field-label">快捷模板</span>
            <div class="template-row" id="templateRow"></div>
          </div>

          <label class="field field-notes">
            <span class="field-label">补充需求（可选）</span>
            <textarea class="notes-input" id="notes" name="notes" rows="2" placeholder="例如：带老人小孩、不想爬太多山、喜欢夜景"></textarea>
            <div class="parsed-tags" id="parsedTags"></div>
          </label>

          <div class="planner-footer">
            <p class="form-error" id="formError" role="alert" hidden></p>
            <p class="progress-text" id="progressText" role="status" hidden></p>
            <p class="budget-note" id="budgetNote"></p>
            <button class="btn btn-primary btn-generate" id="generateBtn" type="submit">
              <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg>
              <span class="btn-label">生成行程</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="result-section" id="result" aria-live="polite" hidden>
      <div class="container">
        <div class="result-head">
          <div>
            <p class="eyebrow">你的路书</p>
            <h2 id="resultTitle">行程</h2>
            <p class="result-meta" id="resultMeta"></p>
          </div>
          <div class="result-actions">
            <button class="btn btn-secondary" id="savePlanBtn" type="button">保存行程</button>
            <button class="btn btn-primary" id="regenerateBtn" type="button">换一批</button>
          </div>
        </div>

        <div class="overview-card" id="overviewCard"></div>
        <div class="skeleton-wrap" id="skeletonWrap" hidden></div>
        <div class="day-cards" id="dayCards"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="savedModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="savedModalTitle">
      <div class="modal-head">
        <h2 id="savedModalTitle">我的行程</h2>
        <button class="modal-close" id="savedClose" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="saved-list" id="savedList"></div>
      <p class="saved-empty" id="savedEmpty" hidden>还没有保存的行程，生成一份试试吧。</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
